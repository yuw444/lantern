<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 530" width="1500" height="530" role="img" aria-label="Three people with local ancestry tracts at a rare variant. Person A is African on both haplotypes, so the allele is African. Person B is European on both, so the allele is European. Person C is African on one haplotype and European on the other, so without phase the allele's ancestry is ambiguous." style="font-family: 'Source Sans 3', 'Source Sans Pro', Helvetica, Arial, sans-serif">
<title>Three people with local ancestry tracts at a rare variant. Person A is African on both haplotypes, so the allele is African. Person B is European on both, so the allele is European. Person C is African on one haplotype and European on the other, so without phase the allele's ancestry is ambiguous.</title>
<rect width="1500" height="530" fill="#FFFFFF"/>

<text x="700" y="22" text-anchor="middle" font-family="Source Sans 3, Helvetica, Arial, sans-serif" font-size="28" fill="#4A5568">rare variant</text>
